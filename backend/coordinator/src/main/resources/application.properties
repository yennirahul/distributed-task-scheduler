spring.application.name=coordinator
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://distributed-task-scheduler-orpin.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001}

# gRPC Server Settings
grpc.server.port=${GRPC_PORT:9090}

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_scheduler_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rahul@766}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Settings
jwt.secret=${JWT_SECRET:E0K2rHo1TIq9HwnHbZHRDhISgoZ6MgnY1DH3EtIWeJ8=}
jwt.expiration-ms=86400000

# Scheduler & Monitoring Configuration
scheduler.poll-interval-ms=5000
scheduler.heartbeat-timeout-seconds=15
scheduler.max-retry-attempts=3

# Logging
logging.level.com.example.scheduler=DEBUG
logging.level.org.springframework.security=INFO
