version: '3.8'

services:
  mysql:
    image: mysql:8.0.36
    container_name: scheduler-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Rahul@766}
      MYSQL_DATABASE: ${DB_NAME:-distributed_scheduler}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: scheduler-coordinator
    environment:
      DB_URL: jdbc:mysql://mysql:3306/distributed_scheduler?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-Rahul@766}
      PORT: 8080
      GRPC_PORT: 9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy

  worker-1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: scheduler-worker-1
    environment:
      COORDINATOR_HOST: coordinator
      COORDINATOR_PORT: 9090
      WORKER_ID: worker-node-1
      WORKER_HOST: worker-1
      WORKER_GRPC_PORT: 9091
      PORT: 8081
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      - coordinator

  worker-2:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: scheduler-worker-2
    environment:
      COORDINATOR_HOST: coordinator
      COORDINATOR_PORT: 9090
      WORKER_ID: worker-node-2
      WORKER_HOST: worker-2
      WORKER_GRPC_PORT: 9092
      PORT: 8082
    ports:
      - "8082:8082"
      - "9092:9092"
    depends_on:
      - coordinator

volumes:
  mysql_data:
